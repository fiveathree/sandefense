<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>長坂坡字陣</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='11' fill='%23c3372b'/%3E%3Crect x='7' y='7' width='50' height='50' rx='7' fill='none' stroke='%23f3ead6' stroke-width='2.5'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='%23f3ead6' font-family='serif'%3E%E6%96%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{
  /* Layout: one fixed screen. Lacquer-black desk frame; the paper battlefield fills the middle; thin top HUD and bottom command bar; everything else opens as a sheet */
  --desk:#17130f; --desk-2:#221c17; --desk-3:#2d251f; --line:#463a30;
  --paper:#eadfc6; --paper-2:#f3ead6; --dim:#a8997e;
  --ink:#1b1815; --seal:#c3372b; --seal-deep:#8f241b; --indigo:#2e4a6c; --gold:#d8a443;
  --r:#d9453a; --sr:#a066e0; --ssr:#f0c04a;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--desk)}
body{height:100%;overflow:hidden;background:var(--desk);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- home ---------- */
.home{position:relative;align-items:center;justify-content:center;padding-block:12px}
.home-top{position:absolute;top:10px;right:0;left:0;display:flex;justify-content:space-between;align-items:center}
.gems{display:flex;align-items:center;gap:8px;background:var(--desk-2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--dim)}
.gems b{font-family:var(--f-display);font-size:18px;color:var(--ssr);font-variant-numeric:tabular-nums}
.record{font-size:12px;color:var(--dim);letter-spacing:.08em}
.home-main{width:min(440px,100%);display:flex;flex-direction:column;align-items:stretch;gap:14px}
.logo{margin:0 0 4px;font-family:var(--f-display);font-weight:700;text-align:center;line-height:1;letter-spacing:.12em;font-size:clamp(40px,11vw,64px);text-wrap:balance}
.logo .r{color:var(--seal)}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:.2em;color:var(--dim);margin-top:10px}
.scene-card{display:flex;gap:14px;align-items:center;background:var(--desk-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.scene-card canvas{flex:none;border-radius:4px;box-shadow:0 0 0 1px rgba(234,223,198,.2)}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--dim)}
.scene-name{font-family:var(--f-display);font-size:30px;line-height:1.1}
.scene-sub{font-size:13px;color:#d6cab0}
.scene-mod{font-size:12px;color:var(--gold);margin-top:2px}
.deck-strip{display:flex;gap:8px;justify-content:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 0;color:var(--dim);font-size:15px;letter-spacing:.1em}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600}
.go{background:var(--seal);color:var(--paper-2);padding:13px;border-radius:10px;font-family:var(--f-display);font-size:24px;letter-spacing:.24em;box-shadow:0 6px 0 var(--seal-deep)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--seal-deep)}
.home-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hbtn{background:var(--desk-2);border:1px solid var(--line);border-radius:8px;padding:10px 0;font-family:var(--f-display);font-size:18px;letter-spacing:.1em}
.hbtn:hover{border-color:var(--dim)}
.hbtn small{display:block;font-family:var(--f-body);font-size:11px;color:var(--dim);letter-spacing:.04em}

/* ---------- chips ---------- */
.chip{flex:none;position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:7px;font-family:var(--f-display);font-weight:900;line-height:1.05;text-align:center;font-size:22px;background:var(--paper-2);color:var(--ink);border:2px solid var(--ink)}
.chip.l2{font-size:15px}.chip.l3{font-size:11.5px}
.chip.hero{background:#17130f;border-width:4px}
.chip.R{border-color:var(--r);color:var(--r)}
.chip.SR{border-color:var(--sr);color:var(--sr)}
.chip.SSR{border-color:var(--ssr);color:var(--ssr);box-shadow:0 0 10px rgba(240,192,74,.45)}
.chip.ployw{background:#14202f;border-color:#7fa6d6;color:#bcd3ef;border-width:3px}
.chip.squad{background:#2a231d;border-color:var(--paper);color:var(--paper-2);border-width:3px}
.chip.ploy{color:var(--indigo);border-color:var(--indigo)}
.chip.part{border-style:dashed;color:#3b332b}
.chip.wpn{background:#201a14;border:3px solid;font-size:12px;line-height:1.1;padding:2px}
.chip.empty{background:transparent;border:2px dashed var(--line);color:var(--dim);font-size:13px}
.chip .st{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:-.5px;color:var(--ssr);background:var(--desk);padding:0 3px;border-radius:3px;white-space:nowrap;font-family:var(--f-body)}
.chip .wm{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:4px;background:var(--gold);color:var(--ink);font-size:10px;display:grid;place-items:center;font-family:var(--f-body)}
.chip .wm.sig{background:var(--seal);color:var(--paper-2)}
.chip.dim{opacity:.32;filter:grayscale(.7)}

/* ---------- battle ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px}
.top{height:52px}
.bottom{height:64px;justify-content:center;padding-bottom:4px}
.camp-row{flex:none;height:clamp(52px,8.5vh,76px);display:flex;align-items:center;justify-content:center}
#campCv{display:block;touch-action:none}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.ghost .chip{width:48px;height:48px}
.mis{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.mis li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--desk)}
.mis li.done{border-color:var(--gold);background:rgba(216,164,67,.08)}
.mis .n{font-family:var(--f-display);font-size:16px}
.mis .d{font-size:12.5px;color:var(--dim)}
.mis .rw{font-size:12.5px;color:var(--gold);white-space:nowrap;text-align:right}
.mis .up{padding:7px 12px;border-radius:8px;background:var(--seal);color:var(--paper-2);font-size:13px;white-space:nowrap}
.mis .up:disabled{background:var(--desk-3);color:var(--dim)}
.lvdots{color:var(--gold);letter-spacing:2px;font-size:12px}
.campinfo{font-size:13px;color:#d6cab0;margin:0 0 12px}
.ibtn{flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:9px;background:var(--desk-2);border:1px solid var(--line);font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.ibtn:hover{border-color:var(--dim)}
.ibtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.wave{display:flex;flex-direction:column;line-height:1.1;min-width:64px}
.wave b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wave small{font-size:11px;color:var(--dim);white-space:nowrap}
.hp{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.hp span,.gold span{font-size:11px;color:var(--dim);letter-spacing:.1em}
.hp b,.gold b{font-family:var(--f-display);font-size:19px}
.hpbar{flex:1;height:7px;min-width:30px;background:#3a302a;border-radius:4px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--seal);transition:width .25s}
.gold{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.gold b{color:var(--ssr)}
.aibtn{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:3px;width:74px;padding:5px 8px;border-radius:9px;background:var(--desk-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.aibtn .row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.aibtn .row b{color:var(--paper);font-size:13px}
.aibtn .hpbar{height:4px}.aibtn .hpbar i{background:var(--indigo)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#meCv{display:block;touch-action:none;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(234,223,198,.22)}
#aiSide{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--desk-2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
#aiSide canvas{border-radius:3px}
.ai-h{font-family:var(--f-display);font-size:15px;letter-spacing:.1em}
.ai-s{font-size:11px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;max-width:150px}
.draw{flex:0 1 auto;height:52px;min-width:120px;padding:0 18px;border-radius:12px;background:var(--seal);color:var(--paper-2);font-family:var(--f-display);font-size:22px;letter-spacing:.12em;box-shadow:0 5px 0 var(--seal-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.draw small{font-family:var(--f-body);font-size:11px;letter-spacing:.04em;opacity:.9;margin-top:3px}
.draw:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--seal-deep)}
.tip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(440px,100%);background:rgba(34,28,23,.96);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip .body{flex:1;min-width:0}
.tip h3{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.2}
.tip h3 small{font-family:var(--f-body);font-size:11px;color:var(--dim);margin-left:6px;letter-spacing:.06em}
.tip p{margin:2px 0 0;font-size:12.5px;color:#d6cab0;line-height:1.45}
.tip .nums{display:flex;gap:12px;font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tip .nums b{color:var(--paper)}
.tip .pt{font-size:12px;color:var(--gold);margin-top:3px}
.tip .acts{display:flex;flex-direction:column;gap:6px}
.sbtn{padding:6px 10px;border-radius:7px;background:var(--desk-3);border:1px solid var(--line);font-size:13px;white-space:nowrap}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,8,6,.66);padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--desk-2);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.sheet>header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.12em}
.x{padding:6px 12px;border-radius:7px;border:1px solid var(--line);font-size:13px;color:var(--dim)}
.mbody{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;overscroll-behavior:contain}
.lede{margin:0 0 12px;color:var(--dim);font-size:13.5px}
.rules{margin:0 0 6px;padding-left:1.2em;display:grid;gap:6px;font-size:14px;color:#ddd2b9}
.rules b{color:var(--paper-2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;color:var(--dim)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--desk)}
.item .n{font-family:var(--f-display);font-size:17px}
.item .r{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.item .d{font-size:12.5px;color:#cdbfa2;line-height:1.45}
.item.off{opacity:.45}
.item .tag{font-size:11px;color:var(--gold);margin-left:6px}
.bond.active{border-color:var(--gold);background:rgba(216,164,67,.08)}
.need{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.need span{font-size:12px;padding:0 6px;border-radius:3px;background:var(--desk-3);color:var(--dim)}
.need span.deck{color:var(--paper)}
.need span.on{background:var(--seal);color:var(--paper-2)}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 6px 6px;border-radius:10px;border:1px solid var(--line);background:var(--desk)}
.slot[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.slot .wl{font-size:11px;color:var(--dim);max-width:64px;text-align:center;line-height:1.2;min-height:2.4em}
.slot .wl.sig{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 8px;justify-items:center}
.grid button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.grid button .chip{width:50px;height:50px}
.infoline{min-height:2.8em;font-size:13px;color:#d6cab0;margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--desk);border:1px solid var(--line)}
.infoline b{color:var(--paper-2)}
.gacha-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pull{display:flex;gap:8px}
.pbtn{padding:10px 16px;border-radius:9px;background:var(--seal);color:var(--paper-2);font-family:var(--f-display);font-size:17px;box-shadow:0 4px 0 var(--seal-deep)}
.pbtn small{display:block;font-family:var(--f-body);font-size:11px;opacity:.85}
.pbtn.ten{background:#7a3fb8;box-shadow:0 4px 0 #4f2780}
.rates{font-size:12px;color:var(--dim)}
.rates b.ssr{color:var(--ssr)}.rates b.sr{color:var(--sr)}.rates b.r{color:var(--r)}
.results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;min-height:180px;align-content:start}
@media (max-width:520px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:9px;background:#120f0c;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;animation:flip .5s ease-out both}
.card .k{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;writing-mode:vertical-rl;letter-spacing:.06em}
.card .t{font-size:10px;color:var(--dim)}
.card .rr{position:absolute;top:4px;left:6px;font-size:10px;font-weight:700;letter-spacing:.04em}
.card .nw{position:absolute;top:4px;right:6px;font-size:10px;color:var(--paper-2);background:var(--seal);padding:0 4px;border-radius:3px}
.card.R{border-color:var(--r)}.card.R .k,.card.R .rr{color:var(--r)}
.card.SR{border-color:var(--sr);background:linear-gradient(160deg,#1d1426,#120f0c)}.card.SR .k,.card.SR .rr{color:var(--sr)}
.card.SSR{border-color:var(--ssr);background:linear-gradient(160deg,#2b2210,#120f0c);box-shadow:0 0 18px rgba(240,192,74,.55)}.card.SSR .k,.card.SSR .rr{color:var(--ssr)}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.end-big{font-family:var(--f-display);font-size:40px;text-align:center;margin:4px 0;letter-spacing:.1em}
.end-big .r{color:var(--seal)}
.end-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:13px}
.end-rows div{background:var(--desk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.end-rows b{font-family:var(--f-display);font-size:16px;color:var(--paper-2)}
.reward{text-align:center;font-size:15px;margin:8px 0 14px}
.reward b{font-family:var(--f-display);font-size:26px;color:var(--ssr)}
.end-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-list{display:grid;gap:8px}
.menu-list .hbtn{text-align:left;padding:12px 14px}
#aiBig{display:block;margin:0 auto;border-radius:4px}

.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));display:grid;gap:6px;z-index:40;pointer-events:none;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--paper-2);color:var(--ink);border-left:4px solid var(--seal);padding:7px 12px;border-radius:5px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:tin .25s ease-out}
.toast.g{border-left-color:var(--gold)}.toast.i{border-left-color:var(--indigo)}
@keyframes tin{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast,.card{animation:none}.hpbar i{transition:none}}
@media (max-width:420px){.bottom{gap:5px}.ibtn{min-width:40px;padding:0 7px;font-size:15px}.draw{min-width:100px;padding:0 12px;font-size:20px}.top{gap:6px}.wave{min-width:56px}}
</style>
</head>
<body>

<div id="app">
  <section id="home" class="screen home" aria-label="主畫面">
    <div class="home-top"><span class="record" id="record">首戰</span><span class="gems">元寶 <b id="gems">0</b></span></div>
    <div class="home-main">
      <h1 class="logo">長坂坡<span class="r">字陣</span><small>抽字 · 連字 · 召名將</small></h1>
      <div class="scene-card"><canvas id="scenePrev" width="80" height="120"></canvas><div><div class="eyebrow">下一戰</div><div class="scene-name" id="sceneName">長坂坡</div><div class="scene-sub" id="sceneSub"></div><div class="scene-mod" id="sceneMod"></div></div></div>
      <div class="deck-strip" id="deckStrip"></div>
      <div class="seg" id="diffSeg" role="group" aria-label="電腦難度">
        <button type="button" id="d-easy" data-d="易" aria-pressed="false">電腦 易</button>
        <button type="button" id="d-mid" data-d="中" aria-pressed="true">電腦 中</button>
        <button type="button" id="d-hard" data-d="難" aria-pressed="false">電腦 難</button>
      </div>
      <button type="button" class="go" id="goBtn">點兵出征</button>
      <div class="home-btns">
        <button type="button" class="hbtn" id="deckBtn">陣容<small>選將配兵器</small></button>
        <button type="button" class="hbtn" id="gachaBtn">抽將<small>武將 · 兵器</small></button>
        <button type="button" class="hbtn" id="helpBtn">說明<small>玩法 · 羈絆</small></button>
      </div>
    </div>
  </section>

  <section id="battle" class="screen" aria-label="戰場" hidden>
    <header class="bar top">

function tickSpecials(b,dt){
 if(b.drumT>0)b.drumT-=dt;const E=b.enemies.filter(e=>!e.dead&&e.hp>0);const bp=WPS[WPS.length-1];

 for(let i=0;i<N;i++){const t=cells[i];if(!t||!isHead(t))continue;const A=udef(t).aura;if(!A)continue;const cx=i%COLS,cy=(i/COLS|0);
  if(A==='speed'||A==='kurou'){for(let j=0;j<N;j++){const u=cells[j];if(u&&j!==i&&Math.hypot(j%COLS-cx,(j/COLS|0)-cy)<=1.5){if(A==='speed')u.spd=true;else u.kurou=true;}}}

 tickSpecials(b,dt);

 for(const e of b.enemies){

  const p=posAt(e.d);e.x=p.x;e.y=p.y;

function aiAct(b,lvl){

  for(const ci of campIdx){const src={z:'c',i:ci};for(const j of em){const r=b.move(src,{z:'b',i:j},true);if(r&&r.res==='link'){const sc=DEF[r.key].cat==='hero'?3:2;if(sc>bs){bs=sc;best=[src,{z:'b',i:j}];}}}}

 // 4) specials
 if(Math.random()<P.merge*.5){for(const k of ['shield','logs','drum']){const c=specCost(b,k);if(c!=null&&b.bao>=c+DRAW_COST+2){b.upgradeSpec(k);return;}}}

 // 7) camp full and nothing to do: discard
 if(!em.length&&b.campFree()===0&&campIdx.length){b.discard(campIdx[0]);}
}
function step(dt){
 if(G.over)return;G.t+=dt;
 if(G.wave<G.maxWave&&G.t>=G.nextAt)startWave();

 G.aiTimer-=dt;if(G.aiTimer<=0){G.aiTimer=DIFF[G.diff].think*(.8+Math.random()*.4);aiAct(G.ai);if(G.autoMe)aiAct(G.me,G.autoMe);}
 const md=G.me.hp<=0,ad=G.ai.hp<=0;
 if(md||ad){G.over=true;G.result=(md&&ad)?'draw':(md?'lose':'win');HOOK.end();return;}
 if(G.wave>=G.maxWave&&!G.me.queue.length&&!G.ai.queue.length&&!G.me.enemies.length&&!G.ai.enemies.length){G.over=true;const dm=G.me.hp-G.ai.hp||G.me.kills-G.ai.kills;G.result=dm>0?'win':dm<0?'lose':'draw';HOOK.end();}
}
function randomDeck(diff){

function drawFx(x,b,C){const W=COLS*C,H=ROWS*C;for(const f of b.fx){const a=Math.max(0,f.life/f.max);x.save();x.globalAlpha=a;
 switch(f.type){

  document.querySelectorAll('#mBody .slot').forEach(bt=>bt.onclick=()=>{slot=+bt.dataset.s;const s=save.deck[slot];info=`<b>${s.h}</b>（${DEF[s.h].rar}·${DEF[s.h].fac}）${DEF[s.h].desc}${s.w?`<br>兵器 <b>${s.w}</b>：${weaponText(s.w)}`:''}`;re();});
  document.querySelectorAll('#mBody .tabs button').forEach(bt=>bt.onclick=()=>{tab=bt.dataset.t;re();});
  document.querySelectorAll('#mBody [data-h]').forEach(bt=>bt.onclick=()=>{const k=bt.dataset.h;if(!save.heroes[k]){info=`<b>${k}</b>（${DEF[k].rar}）尚未得到，可在抽將取得。${DEF[k].desc}`;return re();}
   const other=save.deck.findIndex(s=>s.h===k);if(other===slot){info=`<b>${k}</b>：${DEF[k].desc}`;return re();}
   if(other>=0){const t=save.deck[other].h;save.deck[other].h=save.deck[slot].h;save.deck[slot].h=t;}else save.deck[slot].h=k;persist();info=`<b>${k}</b> 上陣。${DEF[k].desc}`;re();});
  document.querySelectorAll('#mBody [data-w]').forEach(bt=>bt.onclick=()=>{const k=bt.dataset.w;if(k&&!save.weapons[k]){info=`<b>${k}</b> 尚未得到。${weaponText(k)}`;return re();}
   if(k){const other=save.deck.findIndex(s=>s.w===k);if(other>=0&&other!==slot)save.deck[other].w=null;}save.deck[slot].w=k||null;persist();const s=save.deck[slot];info=k?`<b>${s.h}</b> 配上 <b>${k}</b>：${weaponText(k)}`:`<b>${s.h}</b> 卸下兵器。`;re();});};
 const re=()=>{const sc=$('mBody').scrollTop;$('mBody').innerHTML=body();mount();$('mBody').scrollTop=sc;if(!$('home').hidden)renderHome();};
 openModal('陣容',body(),{mount,name:'deck'});
}

/* ---------- gacha ---------- */
function rollOne(forceSR){
 save.pity=(save.pity||0)+1;const r=Math.random();let rar=save.pity>=50||r<.04?'SSR':(r<.26||forceSR)?'SR':'R';if(rar==='SSR')save.pity=0;
 const isHero=Math.random()<.55;
 if(isHero){const pool=HEROES.filter(h=>DEF[h].rar===rar);const k=pool[Math.floor(Math.random()*pool.length)];const had=save.heroes[k]||0;let note='';
  if(!had){save.heroes[k]=1;note='新';}else if(had<5){save.heroes[k]=had+1;note=`★${had+1}`;}else{const g={R:20,SR:60,SSR:200}[rar];save.gems+=g;note=`+${g}寶`;}
  return {kind:'hero',key:k,rar,note};}
 const pool=Object.keys(WDEF).filter(w=>WDEF[w].rar===rar);const k=pool[Math.floor(Math.random()*pool.length)];const had=save.weapons[k]||0;let note='';
 if(!had){save.weapons[k]=1;note='新';}else{const g={R:10,SR:30,SSR:100}[rar];save.gems+=g;note=`+${g}寶`;}
 return {kind:'wpn',key:k,rar,note};}
function openGacha(){let last=[];
 const body=()=>`<div class="gacha-top"><div><div class="rates"><b class="ssr">SSR 4%</b>　<b class="sr">SR 22%</b>　<b class="r">R 74%</b>　·　武將 55%、兵器 45%</div><div class="rates">十連必有 SR 以上；第 50 抽保底 SSR（現 ${save.pity||0}/50）。重複武將升星，滿星或重複兵器轉回元寶。</div></div><div class="gems">元寶 <b>${save.gems}</b></div></div>
  <div class="pull" style="margin-bottom:14px"><button type="button" class="pbtn" id="p1" ${save.gems<100?'disabled':''}>單抽<small>100 元寶</small></button><button type="button" class="pbtn ten" id="p10" ${save.gems<900?'disabled':''}>十連<small>900 元寶</small></button></div>
  <div class="results">${last.length?last.map((r,i)=>`<div class="card ${r.rar}" style="animation-delay:${i*.08}s"><span class="rr">${r.rar}</span>${r.note?`<span class="nw">${r.note}</span>`:''}<span class="k">${r.key}</span><span class="t">${r.kind==='hero'?DEF[r.key].fac+' · 武將':(WDEF[r.key].owner?WDEF[r.key].owner+'專武':'兵器')}</span></div>`).join(''):'<p class="lede" style="grid-column:1/-1">抽到的武將會加入陣容可選名單；兵器可在「陣容」配給武將。</p>'}</div>`;
 const mount=()=>{const p1=$('p1'),p10=$('p10');if(p1)p1.onclick=()=>pull(1);if(p10)p10.onclick=()=>pull(10);};
 const pull=n=>{const cost=n===10?900:100;if(save.gems<cost)return;save.gems-=cost;last=[];for(let i=0;i<n;i++){const force=n===10&&i===9&&!last.some(r=>r.rar!=='R');last.push(rollOne(force));}persist();$('mBody').innerHTML=body();mount();if(!$('home').hidden)renderHome();};
 openModal('抽將',body(),{mount,name:'gacha'});}

/* ---------- battle ---------- */
function startBattle(){
 const land=window.innerWidth>window.innerHeight*1.05;
 const meDeck=save.deck.map(d=>({h:d.h,w:d.w,stars:save.heroes[d.h]||1}));
 newGame({diff,scene:save.scene%SCENES.length,land,meDeck,aiDeck:randomDeck(diff)});
 G.running=true;G.speed=1;userPaused=false;selected=null;drag=null;hints=null;
 $('speedBtn').textContent='×1';$('pauseBtn').setAttribute('aria-pressed','false');$('pauseBtn').textContent='停';$('aiDiff').textContent=diff;
 show('battle');closeModal();resize();renderTip();toast(`${G.scene.name}：軍營已有五字，拖上米字格布陣`,'i');
}
function goHome(){G.running=false;G.over=true;closeModal();$('tip').hidden=true;renderHome();}
function showEnd(){const r=G.result,me=G.me,ai=G.ai;let gain=r==='win'?300+G.wave*10:r==='draw'?200:60+G.wave*10;if(r==='win'&&diff==='難')gain+=150;if(r==='win'&&diff==='易')gain-=100;
 save.gems+=gain;save.games=(save.games||0)+1;if(r==='win')save.wins=(save.wins||0)+1;save.scene=((save.scene||0)+1)%SCENES.length;persist();
 const t=r==='win'?'守住<span class="r">阿斗</span>':r==='lose'?'阿斗<span class="r">失守</span>':'兩軍<span class="r">平手</span>';const nx=SCENES[save.scene];
 openModal(G.scene.name+' 戰報',`<div class="end-big">${t}</div><p class="lede" style="text-align:center">撐到第 ${G.wave} 波。下一戰：${nx.name}（${nx.sub}）</p><div class="end-rows"><div>你　阿斗 <b>${me.hp}</b>　斬 <b>${me.kills}</b><br>召詞 ${me.found.size}・任務 ${me.done.size}</div><div>電腦　阿斗 <b>${ai.hp}</b>　斬 <b>${ai.kills}</b><br>召詞 ${ai.found.size}・任務 ${ai.done.size}</div></div><div class="reward">獲得元寶 <b>+${gain}</b></div><div class="end-btns"><button type="button" class="hbtn" id="eHome">回主畫面</button><button type="button" class="go" id="eNext" style="font-size:19px">下一戰</button></div>`,{name:'end',mount:()=>{$('eHome').onclick=goHome;$('eNext').onclick=startBattle;}});}
function openMenu(){openModal('軍帳',`<div class="menu-list"><button type="button" class="hbtn" id="m1">說明玩法</button><button type="button" class="hbtn" id="m5">詞譜</button><button type="button" class="hbtn" id="m4">羈絆</button><button type="button" class="hbtn" id="m2">看電腦戰場</button><button type="button" class="hbtn" id="m3">退出這一局（不得元寶）</button></div>`,{name:'menu',mount:()=>{$('m1').onclick=()=>openHelp('rules');$('m4').onclick=()=>openHelp('bonds');$('m5').onclick=()=>openHelp('codex');$('m2').onclick=openAi;$('m3').onclick=()=>{if(!exitArm){exitArm=true;$('m3').textContent='再按一次確定退出';return;}goHome();};}});}
function sizeBigAi(){const cv=$('aiBig');if(!cv)return;const mw=Math.min(window.innerWidth-80,640),mh=window.innerHeight-200;const C=Math.max(12,Math.min(mw/COLS,mh/ROWS));bigAi.C=C;sizeCanvas(cv,COLS*C,ROWS*C);}
function openAi(){openModal('電腦戰場',`<p class="lede">電腦（${diff}）阿斗 ${G.ai.hp}／20，斬 ${G.ai.kills}，軍營 ${G.ai.campCap} 格。開啟時戰事暫停。</p><canvas id="aiBig"></canvas>`,{name:'ai',mount:()=>{bigAi={cv:$('aiBig'),C:20};sizeBigAi();}});}
$('menuBtn').onclick=openMenu;$('aiBtn').onclick=openAi;$('aiSide').onclick=openAi;
$('specBtn').onclick=openSpecs;$('missionBtn').onclick=openMissions;
function doDraw(){if(!G.running||G.over||G.paused)return;const b=G.me;if(!b.canDraw()){toast(b.campFree()?`包不夠，抽字要 ${DRAW_COST} 包`:'軍營滿了，先把字放上戰場或棄掉','');return;}const n=b.draw();if(n<DRAW_N)toast(`軍營只剩 ${n} 格，只抽到 ${n} 字`,'i');}
$('drawBtn').onclick=doDraw;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!$('battle').hidden&&$('modal').hidden){e.preventDefault();doDraw();}});
$('rushBtn').onclick=()=>{if(!G.running||G.over||G.wave>=G.maxWave||G.paused)return;G.nextAt=G.t;G.me.bao+=1;toast('催戰！得 1 包','g');};
$('speedBtn').onclick=()=>{G.speed=G.speed===1?2:G.speed===2?3:1;$('speedBtn').textContent='×'+G.speed;};
$('pauseBtn').onclick=()=>{if(!G.running||G.over)return;userPaused=!userPaused;G.paused=userPaused;$('pauseBtn').setAttribute('aria-pressed',String(userPaused));$('pauseBtn').textContent=userPaused?'續':'停';};

/* ---------- tip ---------- */
function renderTip(){const tip=$('tip');const t=(G.me&&selected)?G.me.get(selected):null;if(!t||!G.running){tip.hidden=true;if(selected&&!t)selected=null;return;}
 const D=udef(t),st=stats(G.me,t),inCamp=selected.z==='c';let extra='';if(t.link)extra+=`<div class="pt">連字「${t.link.w}」第 ${t.link.pos+1}/${t.link.idx.length} 字${t.link.pos===0&&D.skill?'，負責放技能':''}</div>`;
 if(!t.link){const ps=[];for(const w of G.me.avail){if(w.includes(t.key)&&w!==t.key)ps.push(w);}if(ps.length)extra=`<div class="pt">可成：${ps.slice(0,6).join('、')}${ps.length>6?'…':''}</div>`;}
 if(D.cat==='hero'){const L=G.me.loadout[D.key];if(L&&L.weapon)extra+=`<div class="pt">兵器 ${L.weapon}${WDEF[L.weapon].owner===D.key?'（專武）':''}${L.stars>1?'　'+'★'.repeat(L.stars):''}</div>`;}
 const act=inCamp?`<button type="button" class="sbtn" id="tAct">棄字</button>`:`<button type="button" class="sbtn" id="tAct">收回軍營</button>`;
 tip.innerHTML=`${chip(t.key)}<div class="body"><h3>${t.link?t.key+' · '+t.link.w:t.key}<small>${D.rar?D.rar+' · '+D.fac+'將':CATNAME[D.cat]} · 第 ${t.lv} 階${inCamp?' · 在軍營':''}</small></h3><p>${D.desc}</p><div class="nums"><span>傷害 <b>${st.rate>0?Math.round(st.dmg):'—'}</b></span><span>每秒 <b>${st.rate>0?st.rate.toFixed(2):'—'}</b></span><span>射程 <b>${st.range>50?'全圖':st.range>0?st.range.toFixed(1):'—'}</b></span>${D.skill?`<span>技能 <b>${D.skill.name}</b> ${skillCd(G.me,t)}s</span>`:''}</div>${extra}${inCamp?`<div class="pt" style="color:var(--dim)">每棄三階字得 1 包（現 ${G.me.discards}/3）</div>`:''}</div><div class="acts">${act}<button type="button" class="sbtn" id="tClose">收起</button></div>`;
 tip.hidden=false;
 $('tAct').onclick=()=>{if(!selected)return;if(selected.z==='c'){const g=G.me.discard(selected.i);if(g)toast(`棄字得 ${g} 包`,'g');}else{const r=G.me.stow(selected.i);if(!r)toast('軍營滿了','');}selected=null;hints=null;renderTip();};
 $('tClose').onclick=()=>{selected=null;hints=null;renderTip();};}

/* ---------- input: drag between board and camp ---------- */
function locAt(px,py){let r=meCv.getBoundingClientRect();if(px>=r.left&&px<r.right&&py>=r.top&&py<r.bottom){const c=Math.floor((px-r.left)/MC),w=Math.floor((py-r.top)/MC);if(c>=0&&c<COLS&&w>=0&&w<ROWS)return {z:'b',i:w*COLS+c};}
 r=campCv.getBoundingClientRect();if(px>=r.left&&px<r.right&&py>=r.top-8&&py<r.bottom+8){const k=Math.floor((px-r.left-campX0)/SC);if(k>=0&&k<CAMP_MAX)return {z:'c',i:k};}return null;}
function computeHints(src){const b=G.me;const h={board:new Map(),camp:new Map()};for(let j=0;j<N;j++){if(!isFree(j))continue;const r=b.move(src,{z:'b',i:j},true);if(r)h.board.set(j,r);}
 for(let k=0;k<b.campCap;k++){if(!b.camp[k])continue;const r=b.move(src,{z:'c',i:k},true);if(r)h.camp.set(k,r);}return h;}
function act(src,dst){const b=G.me;if(!b||G.over)return;if(dst.z==='c'&&dst.i>=b.campCap){toast('這格未開，完成任務可解鎖','');return;}
 const res=b.move(src,dst);if(!res)return;
 if(res==='up'&&dst.z==='b')addFx(b,{type:'ring',x:dst.i%COLS+.5,y:(dst.i/COLS|0)+.5,r0:.2,r1:.8,color:GOLD,life:.4,max:.4,w:.06});
 selected=null;hints=null;renderTip();}
const ghost=document.createElement('div');ghost.className='ghost';ghost.hidden=true;document.body.appendChild(ghost);
function startPointer(ev){if(!G.running||G.over||G.paused)return;const loc=locAt(ev.clientX,ev.clientY);if(!loc)return;ev.preventDefault();const b=G.me;const t=b.get(loc);
 if(loc.z==='c'&&loc.i>=b.campCap){openMissions();return;}
 if(t){drag={src:loc,sx:ev.clientX,sy:ev.clientY,moved:false,id:ev.pointerId};try{ev.target.setPointerCapture(ev.pointerId);}catch(e){}}
 else if(selected&&!(loc.z==='b'&&!isFree(loc.i)))act(selected,loc);
 else{selected=null;hints=null;renderTip();}}
meCv.addEventListener('pointerdown',startPointer);campCv.addEventListener('pointerdown',startPointer);
window.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.id)return;if(!drag.moved&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>7){drag.moved=true;hints=computeHints(drag.src);const t=G.me.get(drag.src);ghost.innerHTML=t?chip(t.key):'';ghost.hidden=false;}
 if(drag.moved){ghost.style.left=ev.clientX+'px';ghost.style.top=(ev.clientY-10)+'px';}});
function endPointer(ev){if(!drag||ev.pointerId!==drag.id)return;const d=drag;drag=null;ghost.hidden=true;
 if(!d.moved){if(selected&&!(selected.z===d.src.z&&selected.i===d.src.i)&&G.me.get(selected))act(selected,d.src);else if(selected&&selected.z===d.src.z&&selected.i===d.src.i){selected=null;hints=null;renderTip();}else{selected=d.src;hints=computeHints(d.src);renderTip();}}
 else{const to=locAt(ev.clientX,ev.clientY);if(to&&!(to.z===d.src.z&&to.i===d.src.i))act(d.src,to);else{hints=selected?computeHints(selected):null;}}}
window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',()=>{drag=null;ghost.hidden=true;});

/* ---------- HUD + loop ---------- */
let hudT=0;
function hud(){const me=G.me,ai=G.ai;if(!me)return;
 $('meHp').textContent=me.hp;$('meHpBar').style.width=(me.hp/me.maxHp*100)+'%';$('meBao').textContent=me.bao;
 $('aiHp').textContent=ai.hp;$('aiHpBar').style.width=(ai.hp/ai.maxHp*100)+'%';
 const free=me.campFree();$('drawCost').textContent=free?`${DRAW_COST} 包`:'軍營滿';$('drawBtn').disabled=!G.running||G.over||!me.canDraw();
 $('waveNum').textContent=G.wave?`第 ${G.wave}/${G.maxWave} 波`:G.scene.name;
 $('waveTimer').textContent=G.over?'戰事已畢':G.paused?'暫停中':G.wave<G.maxWave?`下一波 ${Math.max(0,Math.ceil(G.nextAt-G.t))} 秒`:'最後一波';
 $('rushBtn').disabled=!G.running||G.over||G.wave>=G.maxWave;
 $('missionBtn').textContent=`任務 ${me.done.size}/${MISSIONS.length}`;
 if(!$('aiSide').hidden){const hs=ai.cells.filter(t=>t&&DEF[t.key].cat==='hero').map(t=>t.key);$('aiStats').textContent=`阿斗 ${ai.hp} · 斬 ${ai.kills} · 包 ${ai.bao}${hs.length?' · '+hs.slice(0,3).join('、'):''}`;}}
let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;
 if(G.running&&!G.paused&&!G.over){for(let k=0;k<G.speed;k++)step(dt);}
 if(!$('battle').hidden&&G.me){render(mx,G.me,MC,true);renderCamp();if(!$('aiSide').hidden)render(ax,G.ai,AC,false);if(bigAi&&bigAi.cv.isConnected)render(bigAi.cv.getContext('2d'),G.ai,bigAi.C,false);hudT-=dt;if(hudT<=0){hudT=.1;hud();}}
 requestAnimationFrame(loop);}

/* ---------- boot ---------- */
renderHome();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){let chars=Object.keys(DEF).join('')+Object.keys(WDEF).join('')+'斗風專器鎖+包−0123456789仁王盾擂鼓滾木七進出青龍偃月天下無雙喝斷長坂橋仁德火燒赤壁連營借東閉挾令諸侯鷹視狼顧威震逍遙津拔矢啖睛古之惡來小霸王制衡百騎劫白衣渡江空城計';for(const s of SCENES)chars+=s.foe.join('')+s.boss.join('')+s.flag+s.name;
 document.fonts.load(`900 40px "Noto Serif TC"`,chars).then(()=>{for(const k in bgCache)delete bgCache[k];if(!$('home').hidden)renderHome();}).catch(()=>{});}
})();

</script>
